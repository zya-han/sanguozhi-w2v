# ============================================================================
# 《漢書》(正史) 개체 인식 토큰화 + Word2Vec — 코퍼스 설정
# 실행: CORPUS_CONFIG=config/hanshu.yaml python src/01_…  (docs/ADDING_A_CORPUS.md)
# ============================================================================

seed: 42

paths:
  vendor:        vendor                   # 클론한 업스트림 소스 (CBDB 등, 공유)
  raw:           data/hanshu/raw          # 원문 + provenance
  interim:       data/hanshu/interim      # segments / normalized
  gazetteer:     data/hanshu/gazetteer    # gazetteer.tsv + 시드
  tokenized:     data/hanshu/tokenized    # corpus.jsonl
  models:        models/hanshu            # w2v 모델 + vocab
  reports:       reports/hanshu           # 검증 리포트
  web:           web/hanshu               # 웹 탐색기 출력(07·08)

# ----------------------------------------------------------------------------
# Stage 1 — 원문 수집
# ----------------------------------------------------------------------------
corpus:
  # 정본: 中文維基文庫(zh.wikisource) 漢書 — 100卷(紀12·表8·志10·傳70).
  #   顏師古注 미수록 → 注 없음(본문만). 卷NNN上/下는 卷NNN으로의 리다이렉트(dedup 처리).
  #   표점 포함 → 문장 경계 사용.
  source:          "wikisource"
  wikisource_api:  "https://zh.wikisource.org/w/api.php"
  id:              "hsu"          # segment_id 접두
  book_title:      "漢書"         # allpages 접두 — `漢書/卷…` 실페이지 발견(卷001~卷100)
  provenance:      "漢書 (正史) — 班固 撰 (全 100卷, 顏師古注 미수록)"
  shu_map:                        # 卷 번호 구간 → 체재 (segment 메타)
    - [12, 紀]
    - [20, 表]
    - [30, 志]
    - [100, 傳]
  sentence_close: "。！？」』"
  sentence_open:  "「『"
  # wikisource 漢書에는 顏師古注(唐代)가 {{*|師古曰…}}·{{annotate|}}로 광범위 수록(~9%).
  # 西漢 本文 모델 의도(docs §2)에 맞춰 唐注는 학습 제외 — peizhu 세그먼트는 data엔 보존되나
  # Stage 5가 필터(가제티어·audit는 注 텍스트도 참조). 注 register/주석가名 오염 회피.
  include_peizhu_in_training: false

# ----------------------------------------------------------------------------
# Stage 2 — 정규화
# ----------------------------------------------------------------------------
normalize:
  # wikisource 본문은 正字 번체 + 簡體 오염 혼재 → 보호 예외부 s2t로 번체 통일(고전한문 공통).
  corpus_opencc:   "s2t"
  opencc_protect:  "于云后里征咸并辟游范干余谷系凶沈表面松制致卜丑"
  # 異體字 정규화(s2t 후 적용): 코퍼스마다 재생성 (JPVariants 역방향 + 빈도 다수형).
  variant_map:     "data/hanshu/gazetteer/variant_map.tsv"

# ----------------------------------------------------------------------------
# Stage 3 — 가제티어
# ----------------------------------------------------------------------------
gazetteer:
  cbdb_repo:       "https://github.com/cbdb-project/cbdb_sqlite.git"
  # 漢書 서술 범위: 高祖 元年(-206) ~ 王莽 敗亡(25, 新). CBDB는 前漢 커버리지가 빈약 →
  # 字-추출 + 큐레이션 시드가 주력, CBDB는 보조 (docs §3). 출현 필터가 노이즈 스코핑.
  year_start:      -206
  year_end:        25
  # 29=西漢, 83=漢(generic), 46=新, 2=秦漢
  dynasty_codes:   [29, 83, 46, 2]
  min_surface_len: 2
  extract_names_from_zi: true
  surname_min_persons: 20
  require_corpus_occurrence: true
  # 가제티어 재설계(2026-06-12) — CBDB 노이즈 차단 + 코퍼스 고유 개체 회복:
  cbdb_addr:     false      # ADDR(全왕조 지명) 통째 신뢰 안 함 → 시드 西漢 郡國 + corpus_extract
  cbdb_altname:  zi_only    # CBDB 字/號은 코퍼스가 '字X·號曰X'로 도입한 것만 (길상 字 FP 차단)
  corpus_extract: true      # 봉호·君長號(昆彌·單于)·別名 코퍼스 패턴 추출 (CBDB 미수록분)
  stoplist:        "data/hanshu/gazetteer/stoplist.txt"
  seed_supplement: "data/hanshu/gazetteer/seed_supplement.tsv"
  user_dict:       "data/hanshu/gazetteer/user_dict.tsv"
  opencc_config:   null

# ----------------------------------------------------------------------------
# Stage 4 — 토큰화
# ----------------------------------------------------------------------------
tokenize:
  punctuation_as_token: true

# ----------------------------------------------------------------------------
# Stage 6 — 검증 센티넬 (docs §7: 漢書 = 高祖·霍光·武帝. 코퍼스 실측 후 조정.)
# ----------------------------------------------------------------------------
validate:
  must_single: [高祖, 霍光, 武帝, 王莽, 董仲舒, 蕭何, 韓信, 丞相, 太守, 長安]
  must_char:   [信, 何, 良]              # 단자 名(韓信·蕭何·張良) — 병합 금지 확인
  alias_pair:  [孔子, 仲尼]              # 名·字 독립 공존
  title_probe: "《春秋》"                # 《書名》 단일 토큰 확인
  sim_probes:  [高祖, 霍光, 武帝, 孔子, 丞相, 太守, 長安, 匈奴]

# ----------------------------------------------------------------------------
# Stage 5 — Word2Vec (史記·三國志와 동일 규모대 코퍼스 → 동일 하이퍼파라미터)
# ----------------------------------------------------------------------------
word2vec:
  sg:              1        # skip-gram
  vector_size:     100
  window:          5
  min_count:       3
  negative:        10
  epochs:          25       # 소규모 코퍼스 노출 보강 (epochs 스윕 검증; 통합 sishi 는 노출 ~3× 라 15 유지)
  workers:         1        # 재현성
  seed:            42
  model_name:      "w2v_hanshu.model"
