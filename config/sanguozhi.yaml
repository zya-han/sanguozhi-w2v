# ============================================================================
# 《三國志》(正史) 개체 인식 토큰화 + Word2Vec — 코퍼스 설정
# 다중 코퍼스: 다른 사서는 config/<id>.yaml 로 복사 후 paths·corpus·gazetteer 수정.
# 실행: (기본) python src/01_…  또는  CORPUS_CONFIG=config/houhanshu.yaml python src/01_…
# 새 코퍼스 추가는 docs/ADDING_A_CORPUS.md 참조.
# ============================================================================

seed: 42

paths:
  vendor:        vendor                       # 클론한 업스트림 소스 (CBDB 등, 공유)
  raw:           data/sanguozhi/raw           # 원문 + provenance
  interim:       data/sanguozhi/interim       # segments / normalized
  gazetteer:     data/sanguozhi/gazetteer     # gazetteer.tsv + 시드
  tokenized:     data/sanguozhi/tokenized     # corpus.jsonl
  models:        models/sanguozhi             # w2v 모델 + vocab
  reports:       reports/sanguozhi            # 검증 리포트
  web:           web/sanguozhi                # 웹 탐색기 출력(07·08). 공통 app.js·style.css 는 web/ 공유

# ----------------------------------------------------------------------------
# Stage 1 — 원문 수집
# ----------------------------------------------------------------------------
corpus:
  # 정본: 中文維基文庫(zh.wikisource) 三國志 — 전체 65卷(魏30·蜀15·吳20), 正字 번체.
  #   裴松之 注 = {{*|...}} 템플릿으로 명시 구분. 표점(標點) 포함 → 문장 경계 사용.
  source:          "wikisource"
  wikisource_api:  "https://zh.wikisource.org/w/api.php"
  id:              "sgz"         # segment_id 접두
  book_title:      "三國志"      # allpages 접두 — `三國志/卷…` 실페이지 발견(65卷)
  provenance:      "三國志 (正史) — Chen Shou 撰, Pei Songzhi 注 (全 65卷)"
  shu_map:                       # 卷 번호 구간 → 志/書 (segment 메타; 없으면 '本')
    - [30, 魏書]
    - [45, 蜀書]
    - [65, 吳書]
  # 문장 경계 표점(명세 §2.6). 모두 경계 겸 토큰으로 보존.
  #   close(닫는 부호): 그 '뒤'에서 분리, 직전 세그먼트의 끝 토큰. 문장끝 。！？ + 인용 닫기 」』
  #   open(여는 부호): 그 '앞'에서 분리, 다음 세그먼트의 첫 토큰. 인용 열기 「『
  sentence_close: "。！？」』"
  sentence_open:  "「『"
  # 裴松之 注 학습 포함 여부 (항상 is_peizhu 플래그로 구분 보존; False면 학습에서 제외)
  include_peizhu_in_training: true
  # 교차검증 보조 (선택)
  daizhige_repo:   "https://github.com/garychowcmu/daizhigev20.git"
  ctext_urn:       "ctext:sanguozhi"

# ----------------------------------------------------------------------------
# Stage 2 — 정규화
# ----------------------------------------------------------------------------
normalize:
  # wikisource 三國志는 번체+간체가 혼합 오염(襄阳记 vs 襄陽記)되어 있어 번체로 통일한다.
  # 단, 글자 단위 s2t에 보호 예외를 두어 고전 의미가 다른 글자는 변환하지 않는다
  # (于≠於·云≠雲·后≠後·里≠裏·征≠徵·咸≠鹹·并≠並·辟≠闢·游≠遊·范≠範·干≠幹·余≠餘 …).
  corpus_opencc:   "s2t"
  opencc_protect:  "于云后里征咸并辟游范干余谷系凶沈表面松制致卜丑"
  # 異體字 정규화(s2t 후 적용): 일본 신자체 등 변이형을 코퍼스 다수형으로 통합.
  variant_map:     "data/sanguozhi/gazetteer/variant_map.tsv"

# ----------------------------------------------------------------------------
# Stage 3 — 가제티어
# ----------------------------------------------------------------------------
gazetteer:
  cbdb_repo:       "https://github.com/cbdb-project/cbdb_sqlite.git"
  # 클론 후 vendor/cbdb_sqlite/*.sqlite3 자동 탐색 (HuggingFace latest.zip에서 받음)
  year_start:      25
  year_end:        280
  # 後漢~三國 왕조 코드 (DYNASTIES 실측): 25=東漢,3=三國,26=魏,53=蜀,42=吳,83=漢(generic)
  dynasty_codes:   [25, 3, 26, 53, 42, 83]
  min_surface_len: 2
  extract_names_from_zi: true
  surname_min_persons: 20
  require_corpus_occurrence: true
  cbdb_addr:     false      # ADDR(全왕조 지명) 통째 신뢰 안 함 → 시드 三國 州·郡 + corpus_extract
  cbdb_altname:  zi_only    # CBDB 字/號은 코퍼스가 '字X·號曰X'로 도입한 것만 (길상 字 FP 차단)
  corpus_extract: true      # 봉호 X王/X侯/X君·別名 코퍼스 패턴 추출 (CBDB 미수록 회복)
  stoplist:        "data/sanguozhi/gazetteer/stoplist.txt"
  seed_supplement: "data/sanguozhi/gazetteer/seed_supplement.tsv"
  user_dict:       "data/sanguozhi/gazetteer/user_dict.tsv"
  opencc_config:   null
  tgaz_base:       "https://chgis.hudci.org/tgaz"

# ----------------------------------------------------------------------------
# Stage 4 — 토큰화
# ----------------------------------------------------------------------------
tokenize:
  # 부호도 토큰으로 포함(최장일치 병합 경계라 "相，國"이 相國으로 병합되지 않음).
  punctuation_as_token: true

# ----------------------------------------------------------------------------
# Stage 6 — 검증 센티넬 (사서별; docs/ADDING_A_CORPUS.md §7)
# ----------------------------------------------------------------------------
validate:
  must_single: [諸葛亮, 孔明, 曹操, 劉備, 孫權, 周瑜, 呂蒙, 丞相, 太守, 益州]
  must_char:   [亮, 操, 備, 羽]          # 단자 名 — 병합 금지 확인
  alias_pair:  [諸葛亮, 孔明]            # 名·字 독립 공존
  title_probe: "《魏略》"                # 《書名》 단일 토큰 확인
  sim_probes:  [諸葛亮, 曹操, 劉備, 孫權, 丞相, 太守, 益州, 荆州]

# ----------------------------------------------------------------------------
# Stage 5 — Word2Vec
# ----------------------------------------------------------------------------
word2vec:
  sg:              1        # skip-gram
  vector_size:     100     # 386k 토큰 소규모 → 50~100 권장(200은 과파라미터화)
  window:          5
  min_count:       3
  negative:        10
  epochs:          15
  workers:         1        # 재현성
  seed:            42
  model_name:      "w2v_sanguozhi.model"
